name: Deploy

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

# Serialize migrations and secret creation for this instance.
concurrency:
  group: deploy-${{ vars.WORKER_NAME || 'competitive-bingo' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check deployment tooling
        run: npm run test:deploy
      - name: Build, provision, migrate and deploy
        run: npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          WORKER_NAME: ${{ vars.WORKER_NAME || 'competitive-bingo' }}
